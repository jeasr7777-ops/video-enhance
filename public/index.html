<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Video Enhance</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #172033 0%, #080b12 45%, #05070b 100%);
      color: white;
      padding: 25px 15px;
    }

    .container {
      width: 100%;
      max-width: 850px;
      margin: auto;
    }

    /* الهيدر */
    header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .logo span {
      color: #00e5ff;
    }

    .subtitle {
      color: #9da7b8;
      margin-top: 8px;
      font-size: 15px;
    }

    /* مكان الصورة لاحقًا */
    .hero-image {
      width: 100%;
      height: 180px;
      border-radius: 22px;
      margin-bottom: 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px dashed #344054;
      background: rgba(255,255,255,0.025);
      color: #697386;
      overflow: hidden;
    }

    .hero-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    /* البطاقة */
    .card {
      background: rgba(14, 19, 30, 0.92);
      border: 1px solid #263043;
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    /* رفع الفيديو */
    .upload-box {
      border: 2px dashed #344054;
      border-radius: 20px;
      padding: 38px 20px;
      text-align: center;
      cursor: pointer;
      transition: .2s;
    }

    .upload-box:hover {
      border-color: #00e5ff;
      background: rgba(0,229,255,.035);
    }

    .upload-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .upload-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .upload-text {
      color: #8993a5;
      font-size: 14px;
    }

    #videoInput {
      display: none;
    }

    /* اسم الملف */
    .file-name {
      margin-top: 15px;
      text-align: center;
      color: #00e5ff;
      font-size: 14px;
      min-height: 20px;
      word-break: break-word;
    }

    /* الخيارات */
    .section-title {
      margin-top: 25px;
      margin-bottom: 12px;
      font-size: 16px;
      font-weight: bold;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .option {
      position: relative;
    }

    .option input {
      display: none;
    }

    .option label {
      display: block;
      text-align: center;
      padding: 15px 8px;
      border: 1px solid #30394b;
      border-radius: 14px;
      cursor: pointer;
      color: #aeb7c6;
      transition: .2s;
      font-weight: bold;
    }

    .option input:checked + label {
      border-color: #00e5ff;
      background: rgba(0,229,255,.10);
      color: white;
      box-shadow: 0 0 18px rgba(0,229,255,.10);
    }

    /* زر TikTok */
    .tiktok-btn {
      width: 100%;
      margin-top: 22px;
      padding: 17px;
      border: 0;
      border-radius: 15px;
      background: linear-gradient(135deg, #00e5ff, #007cff);
      color: white;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,140,255,.25);
      transition: .2s;
    }

    .tiktok-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .tiktok-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none;
    }

    /* التقدم */
    .progress-section {
      display: none;
      margin-top: 25px;
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 9px;
      font-size: 14px;
      color: #aeb7c6;
    }

    .progress-bar {
      width: 100%;
      height: 12px;
      background: #202838;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 20px;
      background: linear-gradient(90deg, #00e5ff, #007cff);
      transition: width .25s ease;
    }

    .status {
      text-align: center;
      color: #8f9bad;
      margin-top: 12px;
      font-size: 14px;
    }

    /* النتيجة */
    .result {
      display: none;
      margin-top: 22px;
      padding: 18px;
      border-radius: 16px;
      background: rgba(0,255,170,.06);
      border: 1px solid rgba(0,255,170,.25);
      text-align: center;
    }

    .result-title {
      font-weight: bold;
      margin-bottom: 12px;
    }

    .download-btn {
      display: inline-block;
      text-decoration: none;
      background: #00c98d;
      color: white;
      padding: 13px 25px;
      border-radius: 12px;
      font-weight: bold;
    }

    .error {
      display: none;
      margin-top: 15px;
      padding: 13px;
      border-radius: 12px;
      background: rgba(255,50,70,.08);
      border: 1px solid rgba(255,50,70,.25);
      color: #ff8794;
      text-align: center;
      font-size: 14px;
    }

    footer {
      text-align: center;
      color: #555f70;
      font-size: 12px;
      margin-top: 25px;
    }

    @media (max-width: 600px) {
      body {
        padding: 15px 10px;
      }

      .card {
        padding: 15px;
      }

      .logo {
        font-size: 28px;
      }

      .options {
        grid-template-columns: 1fr;
      }

      .hero-image {
        height: 140px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <div class="logo">
        Video<span>Enhance</span>
      </div>

      <div class="subtitle">
        حسّن فيديوهاتك وجهزها للنشر بجودة عالية
      </div>
    </header>

    <!-- الصورة نضيفها هنا لاحقًا -->
    <div class="hero-image">
      <span id="imagePlaceholder">
        مكان الصورة — 4K / 120FPS
      </span>

      <!--
      لاحقًا نحط صورتك هنا:
      <img src="image.jpg" alt="4K 120FPS">
      -->
    </div>

    <div class="card">

      <!-- رفع الفيديو -->
      <label class="upload-box" for="videoInput">
        <div class="upload-icon">🎬</div>

        <div class="upload-title">
          ارفع الفيديو
        </div>

        <div class="upload-text">
          اضغط هنا لاختيار الفيديو من جهازك
        </div>
      </label>

      <input
        type="file"
        id="videoInput"
        accept="video/*"
      >

      <div class="file-name" id="fileName"></div>

      <!-- FPS -->
      <div class="section-title">
        🎞️ معدل الإطارات
      </div>

      <div class="options">

        <div class="option">
          <input
            type="radio"
            name="fps"
            id="fps60"
            value="60"
            checked
          >

          <label for="fps60">
            60 FPS
          </label>
        </div>

        <div class="option">
          <input
            type="radio"
            name="fps"
            id="fps120"
            value="120"
          >

          <label for="fps120">
            120 FPS
          </label>
        </div>

        <div class="option">
          <input
            type="radio"
            name="fps"
            id="fpsOriginal"
            value="original"
          >

          <label for="fpsOriginal">
            الأصلي
          </label>
        </div>

      </div>

      <!-- الجودة -->
      <div class="section-title">
        💎 الجودة
      </div>

      <div class="options">

        <div class="option">
          <input
            type="radio"
            name="quality"
            id="quality1080"
            value="1080"
          >

          <label for="quality1080">
            1080P
          </label>
        </div>

        <div class="option">
          <input
            type="radio"
            name="quality"
            id="quality2k"
            value="2k"
          >

          <label for="quality2k">
            2K
          </label>
        </div>

        <div class="option">
          <input
            type="radio"
            name="quality"
            id="quality4k"
            value="4k"
            checked
          >

          <label for="quality4k">
            4K
          </label>
        </div>

      </div>

      <!-- زر TikTok -->
      <button
        class="tiktok-btn"
        id="processBtn"
        disabled
      >
        ⚡ TikTok Ready
      </button>

      <!-- التقدم -->
      <div
        class="progress-section"
        id="progressSection"
      >

        <div class="progress-top">
          <span>جاري تحسين الفيديو</span>
          <span id="progressText">0%</span>
        </div>

        <div class="progress-bar">
          <div
            class="progress-fill"
            id="progressFill"
          ></div>
        </div>

        <div
          class="status"
          id="status"
        >
          جاري تجهيز الفيديو...
        </div>

      </div>

      <!-- الخطأ -->
      <div
        class="error"
        id="errorBox"
      ></div>

      <!-- النتيجة -->
      <div
        class="result"
        id="resultBox"
      >

        <div class="result-title">
          ✅ تم تجهيز الفيديو بنجاح
        </div>

        <a
          class="download-btn"
          id="downloadBtn"
          href="#"
          download
        >
          📥 تحميل الفيديو
        </a>

      </div>

    </div>

    <footer>
      VideoEnhance © 2026
    </footer>

  </div>


<script>

  const videoInput = document.getElementById("videoInput");
  const fileName = document.getElementById("fileName");
  const processBtn = document.getElementById("processBtn");

  const progressSection =
    document.getElementById("progressSection");

  const progressFill =
    document.getElementById("progressFill");

  const progressText =
    document.getElementById("progressText");

  const status =
    document.getElementById("status");

  const resultBox =
    document.getElementById("resultBox");

  const downloadBtn =
    document.getElementById("downloadBtn");

  const errorBox =
    document.getElementById("errorBox");


  let selectedFile = null;


  // اختيار الفيديو
  videoInput.addEventListener("change", function () {

    selectedFile = this.files[0];

    resultBox.style.display = "none";
    errorBox.style.display = "none";

    if (!selectedFile) {
      fileName.textContent = "";
      processBtn.disabled = true;
      return;
    }

    fileName.textContent =
      "🎬 " + selectedFile.name;

    processBtn.disabled = false;

  });


  // زر TikTok Ready
  processBtn.addEventListener("click", async function () {

    if (!selectedFile) {
      return;
    }

    processBtn.disabled = true;

    resultBox.style.display = "none";
    errorBox.style.display = "none";

    progressSection.style.display = "block";

    setProgress(1, "جاري رفع الفيديو...");


    const formData = new FormData();

    formData.append("video", selectedFile);

    formData.append(
      "fps",
      document.querySelector(
        'input[name="fps"]:checked'
      ).value
    );

    formData.append(
      "quality",
      document.querySelector(
        'input[name="quality"]:checked'
      ).value
    );

    formData.append(
      "mode",
      "tiktok-ready"
    );


    try {

      /*
        السيرفر المتوقع:
        POST /process
      */

      const response = await uploadWithProgress(
        "/process",
        formData
      );


      if (!response.ok) {

        let message =
          "حدث خطأ أثناء معالجة الفيديو.";

        try {
          const data = await response.json();

          if (data.message) {
            message = data.message;
          }
        } catch (e) {}

        throw new Error(message);
      }


      setProgress(
        95,
        "جاري تجهيز الملف النهائي..."
      );


      const data =
        await response.json();


      if (!data.url) {
        throw new Error(
          "السيرفر لم يرجع رابط الفيديو."
        );
      }


      setProgress(
        100,
        "اكتمل تجهيز الفيديو ✅"
      );


      downloadBtn.href = data.url;

      if (data.filename) {
        downloadBtn.download =
          data.filename;
      }


      resultBox.style.display = "block";


    } catch (error) {

      console.error(error);

      progressSection.style.display = "none";

      errorBox.textContent =
        error.message ||
        "حدث خطأ غير معروف.";

      errorBox.style.display = "block";

    }


    processBtn.disabled = false;

  });


  // تحديث التقدم
  function setProgress(percent, message) {

    percent =
      Math.max(
        0,
        Math.min(100, percent)
      );

    progressFill.style.width =
      percent + "%";

    progressText.textContent =
      Math.round(percent) + "%";

    status.textContent =
      message;

  }


  // رفع الملف مع متابعة نسبة الرفع
  function uploadWithProgress(url, formData) {

    return new Promise(
      (resolve, reject) => {

        const xhr =
          new XMLHttpRequest();


        xhr.open(
          "POST",
          url,
          true
        );


        xhr.upload.addEventListener(
          "progress",
          function (event) {

            if (!event.lengthComputable) {
              return;
            }

            const percent =
              (event.loaded /
               event.total) * 80;

            setProgress(
              Math.max(1, percent),
              "جاري رفع الفيديو..."
            );

          }
        );


        xhr.addEventListener(
          "load",
          function () {

            const response = {

              ok:
                xhr.status >= 200 &&
                xhr.status < 300,

              status:
                xhr.status,

              async json() {

                try {
                  return JSON.parse(
                    xhr.responseText
                  );
                } catch (e) {

                  return {
                    message:
                      xhr.responseText
                  };

                }

              }

            };

            resolve(response);

          }
        );


        xhr.addEventListener(
          "error",
          function () {

            reject(
              new Error(
                "تعذر الاتصال بالسيرفر."
              )
            );

          }
        );


        xhr.addEventListener(
          "abort",
          function () {

            reject(
              new Error(
                "تم إلغاء رفع الفيديو."
              )
            );

          }
        );


        xhr.send(formData);

      }
    );

  }

</script>

</body>
</html>
