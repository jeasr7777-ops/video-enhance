
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Enhance</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 600px;
      background: #151515;
      border: 1px solid #292929;
      border-radius: 24px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 32px;
    }
    .subtitle {
      color: #aaa;
      margin-bottom: 30px;
    }
    .upload {
      border: 2px dashed #444;
      border-radius: 18px;
      padding: 40px 20px;
      cursor: pointer;
      transition: .2s;
      margin-bottom: 20px;
    }
    .upload:hover {
      border-color: #777;
      background: #1b1b1b;
    }
    .upload-icon {
      font-size: 55px;
      margin-bottom: 10px;
    }
    .upload-text {
      font-size: 18px;
      font-weight: bold;
    }
    .upload-small {
      color: #888;
      margin-top: 8px;
      font-size: 14px;
    }
    input[type="file"] {
      display: none;
    }
    video {
      width: 100%;
      max-height: 350px;
      border-radius: 15px;
      margin: 15px 0;
      display: none;
      background: black;
    }
    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: white;
      color: black;
      margin-top: 10px;
    }
    button:disabled {
      opacity: .4;
      cursor: not-allowed;
    }
    .progress-box {
      display: none;
      margin-top: 20px;
    }
    .progress {
      width: 100%;
      height: 10px;
      background: #292929;
      border-radius: 20px;
      overflow: hidden;
    }
    .bar {
      width: 0%;
      height: 100%;
      background: white;
      transition: width .3s;
    }
    .status {
      margin-top: 12px;
      color: #bbb;
      font-size: 14px;
    }
    .result {
      display: none;
      margin-top: 25px;
      padding: 20px;
      background: #1d1d1d;
      border-radius: 16px;
    }
    .download {
      display: block;
      text-decoration: none;
      background: white;
      color: black;
      padding: 15px;
      border-radius: 12px;
      font-weight: bold;
      margin-top: 15px;
    }
    .error {
      display: none;
      margin-top: 20px;
      padding: 14px;
      border-radius: 12px;
      background: #301515;
      color: #ff9b9b;
    }
    .info {
      margin-top: 25px;
      color: #777;
      font-size: 13px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 Video Enhance</h1>
    <div class="subtitle">
      حسّن جودة الفيديو وحوّله إلى 4K 60FPS
    </div>
    <label class="upload" for="videoInput">
      <div class="upload-icon">📤</div>
      <div class="upload-text">اختر فيديو</div>
      <div class="upload-small">
        اضغط هنا لاختيار الفيديو
      </div>
    </label>
    <input
      id="videoInput"
      type="file"
      accept="video/*"
    >
    <video id="preview" controls></video>
    <button id="enhanceBtn" disabled>
      تحسين الفيديو إلى 4K 60FPS
    </button>
    <div class="progress-box" id="progressBox">
      <div class="progress">
        <div class="bar" id="progressBar"></div>
      </div>
      <div class="status" id="status">
        جاري رفع الفيديو...
      </div>
    </div>
    <div class="result" id="result">
      <div>✅ تم الانتهاء من معالجة الفيديو</div>
      <a
        id="downloadBtn"
        class="download"
        href="#"
        target="_blank"
      >
        تحميل الفيديو
      </a>
    </div>
    <div class="error" id="error"></div>
    <div class="info">
      الحد الأقصى لحجم الفيديو: 500MB<br>
      المعالجة تتم على الخادم باستخدام FFmpeg
    </div>
  </div>
<script>
const videoInput = document.getElementById("videoInput");
const preview = document.getElementById("preview");
const enhanceBtn = document.getElementById("enhanceBtn");
const progressBox = document.getElementById("progressBox");
const progressBar = document.getElementById("progressBar");
const status = document.getElementById("status");
const result = document.getElementById("result");
const downloadBtn = document.getElementById("downloadBtn");
const errorBox = document.getElementById("error");
let selectedFile = null;
videoInput.addEventListener("change", () => {
  hideError();
  result.style.display = "none";
  const file = videoInput.files[0];
  if (!file) {
    selectedFile = null;
    enhanceBtn.disabled = true;
    preview.style.display = "none";
    return;
  }
  if (!file.type.startsWith("video/")) {
    showError("الملف المختار ليس فيديو.");
    enhanceBtn.disabled = true;
    return;
  }
  if (file.size > 500 * 1024 * 1024) {
    showError("حجم الفيديو أكبر من 500MB.");
    enhanceBtn.disabled = true;
    return;
  }
  selectedFile = file;
  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
  enhanceBtn.disabled = false;
});
enhanceBtn.addEventListener("click", async () => {
  if (!selectedFile) {
    showError("اختر فيديو أولاً.");
    return;
  }
  hideError();
  enhanceBtn.disabled = true;
  progressBox.style.display = "block";
  result.style.display = "none";
  progressBar.style.width = "10%";
  status.textContent = "جاري رفع الفيديو...";
  const formData = new FormData();
  formData.append("video", selectedFile);
  try {
    const response = await fetch("/api/enhance", {
      method: "POST",
      body: formData
    });
    progressBar.style.width = "70%";
    status.textContent = "جاري معالجة الفيديو...";
    const data = await response.json();
    if (!response.ok) {
      throw new Error(data.error || "حدث خطأ أثناء المعالجة.");
    }
    progressBar.style.width = "100%";
    status.textContent = "اكتملت المعالجة 🎉";
    downloadBtn.href = data.download;
    result.style.display = "block";
  } catch (error) {
    console.error(error);
    showError(error.message || "حدث خطأ غير معروف.");
    progressBox.style.display = "none";
  } finally {
    enhanceBtn.disabled = false;
  }
});
function showError(message) {
  errorBox.textContent = message;
  errorBox.style.display = "block";
}
function hideError() {
  errorBox.style.display = "none";
}
</script>
</body>
</html>
